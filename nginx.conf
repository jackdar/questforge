server {
    listen 80;
    root /usr/share/nginx/html;

    # Look up the server container at request time. A container can get a new address when Compose recreates it.
    resolver 127.0.0.11 valid=10s;
    set $game_server http://server:3030;

    location / {
        try_files $uri $uri/ =404;
    }

    # The browser must check index.html on each load, or it keeps a page that points to an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a hash of the content in each asset file name, so a changed file always gets a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # $http_host keeps the port, such as localhost:8080. The server compares it with the Origin header of the page.
    location /api/ {
        proxy_pass $game_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        proxy_pass $game_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
}
